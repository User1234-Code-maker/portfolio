    <style>
      html.no-boot #boot{display:none}
      html.booting{overflow:hidden}
      #boot{position:fixed;inset:0;z-index:1000;overflow:hidden;background:linear-gradient(180deg,#D7E4FC,#E6E1F8);
        clip-path:inset(0 0 0 0);transition:clip-path .85s cubic-bezier(.7,0,.2,1);cursor:pointer}
      #boot.out{clip-path:inset(0 0 100% 0);pointer-events:none}
      #boot.out .b-center{opacity:0;transform:translateY(-24px) scale(.96);transition:opacity .35s,transform .5s}
      #boot svg,#boot i{position:absolute;display:block}
      .b-grid{inset:0;width:100%;height:100%}
      .b-grid line{stroke:rgba(78,106,200,.22);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;
        animation:bdraw .9s ease-out var(--d) forwards}
      .b-city{left:0;bottom:0;width:100%;height:46%}
      .b-city path{stroke:rgba(78,106,200,.45);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;
        fill:rgba(120,140,225,0);animation:bdraw 1.2s ease-out .35s forwards,bfill .6s ease 1.1s forwards}
      .b-cloud{width:46vw;height:16vw;max-width:620px;max-height:200px;border-radius:50%;filter:blur(26px);opacity:0;
        background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0));animation:bfade 1s ease .5s forwards}
      .c1{left:-6vw;top:12%}.c2{right:-8vw;top:34%;animation-delay:.75s}
      .b-star{width:22px;height:22px;fill:#fff;filter:drop-shadow(0 0 8px rgba(124,92,255,.9));opacity:0;scale:.2;animation:bstar .6s ease 1.05s forwards}
      .s1{left:22%;top:26%}.s2{right:24%;top:62%;width:16px;height:16px;animation-delay:1.25s}
      .b-center{position:absolute;left:50%;top:46%;translate:-50% -50%;display:flex;flex-direction:column;align-items:center;gap:18px}
      .b-cap{position:relative!important;width:clamp(96px,16vw,140px);height:auto;overflow:visible}
      .b-cap .cl path{stroke-dasharray:1;stroke-dashoffset:1;animation:bdraw .95s cubic-bezier(.5,0,.2,1) .2s forwards}
      .b-cap .cf{opacity:0;animation:bfade .45s ease .95s forwards}
      .b-word{font:800 clamp(34px,6vw,52px)/1 Manrope,system-ui,sans-serif;letter-spacing:-.03em;color:#1E2A6B;clip-path:inset(0 100% 0 0);
        animation:bwipe .5s cubic-bezier(.6,0,.2,1) 1s forwards}
      .b-bar{position:relative!important;width:120px;height:3px;border-radius:3px;background:rgba(30,42,107,.14);overflow:hidden}
      .b-bar i{inset:0;background:#6B5BD6;transform-origin:left;transform:scaleX(0);animation:bbar 1.4s cubic-bezier(.4,0,.2,1) .1s forwards}
      @keyframes bdraw{to{stroke-dashoffset:0}}
      @keyframes bfill{to{fill:rgba(120,140,225,.16)}}
      @keyframes bfade{to{opacity:1}}
      @keyframes bstar{to{opacity:1;scale:1}}
      @keyframes bwipe{to{clip-path:inset(0 0 0 0)}}
      @keyframes bbar{to{transform:scaleX(1)}}
    </style>
    <noscript><style>#boot{display:none}</style></noscript>
    <script>
      // заставка только при первом визите (или по ссылке ?intro); без анимации при reduced-motion
      (function () {
        var r = document.documentElement
        window.__bootT = performance.now()
        // предзагрузка картинок Hero только на главной
        if (location.pathname === '%BASE_URL%' || location.pathname + '/' === '%BASE_URL%') {
          var t = document.getElementById('home-preloads')
          if (t) document.head.appendChild(t.content.cloneNode(true))
        }
        try {
          var seen = localStorage.getItem('boot-v1')
          var forced = /[?&]intro\b/.test(location.search)
          var calm = matchMedia('(prefers-reduced-motion: reduce)').matches
          if ((seen && !forced) || calm) r.classList.add('no-boot')
          else r.classList.add('booting')
        } catch (e) {
          r.classList.add('no-boot')
        }
      })()
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bogdan Korzun — Fullstack Developer & Musician" />
